name: Daily Report

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and push daily report
        run: uv run python -m assistant daily
        env:
          ASSISTANT_PUSHPLUS_TOKEN: ${{ secrets.ASSISTANT_PUSHPLUS_TOKEN }}
          ASSISTANT_WECOM_GROUP_WEBHOOK: ${{ secrets.ASSISTANT_WECOM_GROUP_WEBHOOK }}
          ASSISTANT_PUSH_CHANNELS: '["pushplus", "wecom_group"]'
