name: Daily Report

on:
  # 日报已由云服务器 systemd timer 每天 08:00 执行；此工作流仅保留手动触发。
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run python -m pytest -q

  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Generate and push daily report
        run: uv run python -m assistant daily
        env:
          ASSISTANT_PUSHPLUS_TOKEN: ${{ secrets.ASSISTANT_PUSHPLUS_TOKEN }}
          ASSISTANT_WECOM_GROUP_WEBHOOK: ${{ secrets.ASSISTANT_WECOM_GROUP_WEBHOOK }}
          ASSISTANT_PUSH_CHANNELS: '["pushplus", "wecom_group"]'