[project]
name = "personal-assistant"
version = "0.1.0"
description = "A personal daily report assistant with WeChat push and web surfaces."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28.1",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.12",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assistant = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
