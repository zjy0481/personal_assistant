# V1 单用户配置模板。
# 复制为 config.toml 后按需修改；真实密钥建议只放在 .env，不要提交到 Git。
location = "上海"
timezone = "Asia/Shanghai"

# 启用的数据源；后续数据源模块按此名单启用。
data_source_whitelist = ["weather", "news", "github", "ai"]

# 新闻与 AI 允许采集的信源 key。
source_whitelist = ["xinhua", "people", "thepaper", "chinanews", "cctv", "reuters", "ap", "bbc"]

# 推送渠道按顺序尝试；pushplus 为主渠道，wecom_group 为备用渠道。
push_channels = ["pushplus", "wecom_group"]

# 每个内容板块默认推送条数上限。
push_max_items = 5

# PushPlus 微信服务号主渠道；token 建议只放在 .env。
pushplus_token = ""

# 企业微信群机器人备用渠道；Webhook URL 含密钥，建议只放在 .env。
wecom_group_webhook = ""

# 本地验证可设为 true，使用 mock 适配器，不调用真实推送 API。
push_mock = false

# 以下为企业微信自建应用遗留配置，仅供旧 WeComPushAdapter 使用；新方案不需要。
wecom_corpid = ""
wecom_agentid = ""
wecom_secret = ""
wecom_userid = ""

# 本地验证旧适配器时可设为 true。
wecom_mock = false

# 日报网页跳转地址；公网部署时改为实际可访问地址。
web_url = "http://127.0.0.1:8000/"

# 公网网页鉴权 token；本机测试留空。
auth_token = ""

# 公网部署时设为 true；此时 auth_token 不能为空。
web_require_auth = false